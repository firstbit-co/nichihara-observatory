# 専用リポジトリに切り出した後に使う GitHub Pages への公開(firstbit-corporate 内では動かない)
# 事前設定: Settings → Pages → Source を「GitHub Actions」に。
#           Settings → Secrets and variables → Actions → Variables に
#           PUBLIC_ALLOW_INDEX(本公開で true、それまでは false)
#           独自ドメインを設定するまでは https://<org>.github.io/<repo>/ で配信され、URL とサブパスは自動で決まる
name: Deploy

on:
  push:
    branches: [main]
  # 「これからのイベント」の鮮度を保つため毎朝 6:00 JST に再公開
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_ALLOW_INDEX: ${{ vars.PUBLIC_ALLOW_INDEX || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      # 表記の検査は確定稿と同じ形(サブパスなし)のビルドで行い、そのあと公開用にビルドし直す
      - run: npm run build && npm run check:copy
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - run: node scripts/apply-base.mjs
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
